spring.application.name=photoconnect

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# ── Locale Configuration (Standardized to en_US) ─────────────────────────────
spring.web.locale=en_US
spring.web.locale-resolver=fixed

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=PhotoConnect;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ── Multipart file uploads (portfolio images) ─────────────────────────────────
# 10 MB per image, 10 MB per request (single-image upload form)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Cloudinary (TASK-011) ─────────────────────────────────────────────────────
# Values must be supplied via environment variables at runtime.
# NEVER commit real credentials to source control.
# Set: CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ── Demo Deposit Checkout (TASK-015 / TASK-029) ───────────────────────────────
# Local demonstration only. No gateway, bank API, merchant account, or transfer.
photoconnect.payment.simulation-enabled=${PAYMENT_SIMULATION_ENABLED:true}

# Comma-separated trusted browser origins for WebSocket handshakes.
photoconnect.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:8080}

# ── JWT authentication (TASK-D01) ────────────────────────────────────────────
# JWT_SECRET is required and must be a Base64-encoded key of at least 32 bytes.
# Generate a unique secret outside source control; application startup fails if
# it is absent or weak. Access tokens intentionally expire after 30 minutes.
photoconnect.jwt.secret=${JWT_SECRET:}
photoconnect.jwt.expiration=PT30M
# Use true for every HTTPS deployment. Local HTTP development may leave false.
photoconnect.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}

# Supabase is used only for external Google identity verification (TASK-D02).
# SQL Server and the PhotoConnect JWT remain authoritative for application data
# and protected routes. The service-role key is neither required nor accepted.
photoconnect.supabase.url=${SUPABASE_URL:}
photoconnect.supabase.anon-key=${SUPABASE_ANON_KEY:}
photoconnect.supabase.oauth-redirect-uri=${SUPABASE_OAUTH_REDIRECT_URI:}
