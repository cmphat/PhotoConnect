spring.application.name=photoconnect

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# ── Locale Configuration (Standardized to en_US) ─────────────────────────────
spring.web.locale=en_US
spring.web.locale-resolver=fixed

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=PhotoConnect;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ── Connection Pool (HikariCP) ───────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:15}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=PhotoConnectHikariCP

# ── Database Migration (Flyway) ──────────────────────────────────────────────
# Flyway executes versioned schema migrations on application startup.
# Baseline-on-migrate enables smooth adoption on existing databases without wiping data.
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true

# ── Hibernate Schema Management ───────────────────────────────────────────────
# In production and controlled release environments, Hibernate must validate the schema
# against JPA entities rather than mutating the database. Migrations are managed by Flyway.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# ── Multipart file uploads (portfolio images) ─────────────────────────────────
# 10 MB per image, 10 MB per request (single-image upload form)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Cloudinary (TASK-011) ─────────────────────────────────────────────────────
# Values must be supplied via environment variables at runtime.
# NEVER commit real credentials to source control.
# Set: CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ── PhotoConnect V6 Payment & VietQR Configuration ───────────────────────────
# Simulation enabled by default for university demo. Real mode disabled by default.
photoconnect.payment.simulation-enabled=${PAYMENT_SIMULATION_ENABLED:true}
photoconnect.payment.mode=${PAYMENT_MODE:DEMO}
photoconnect.payment.real-enabled=${PAYMENT_REAL_ENABLED:false}
photoconnect.payment.provider=${PAYMENT_PROVIDER:demo}
photoconnect.payment.payos.client-id=${PAYOS_CLIENT_ID:}
photoconnect.payment.payos.api-key=${PAYOS_API_KEY:}
photoconnect.payment.payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
photoconnect.payment.sepay.api-key=${SEPAY_API_KEY:}
photoconnect.payment.sepay.account-number=${SEPAY_ACCOUNT_NUMBER:}
photoconnect.payment.sepay.bank-name=${SEPAY_BANK_NAME:MBBank}
photoconnect.payment.vietqr.bank-id=${VIETQR_BANK_ID:}
photoconnect.payment.vietqr.account-no=${VIETQR_ACCOUNT_NO:}
photoconnect.payment.vietqr.account-name=${VIETQR_ACCOUNT_NAME:}

# Comma-separated trusted browser origins for WebSocket handshakes.
photoconnect.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:8080}

# ── JWT authentication (TASK-D01) ────────────────────────────────────────────
# JWT_SECRET is required and must be a Base64-encoded key of at least 32 bytes (256 bits).
# It MUST be provided via the JWT_SECRET environment variable or secure vault.
# No default secret is committed; application startup strictly fails if missing or weak.
photoconnect.jwt.secret=${JWT_SECRET:}
photoconnect.jwt.expiration=PT30M
# Use true for every HTTPS deployment. Local HTTP development may leave false.
photoconnect.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}

# Native Spring Security OAuth2 Client / OpenID Connect. Both values are optional;
# the client registration and login button are created only when both are present.
# Callback: {baseUrl}/login/oauth2/code/google
photoconnect.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
photoconnect.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# ── Mail Configuration (JavaMailSender / SMTP / Capture Mode) ────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:${MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Capture is explicit. With false, missing SMTP credentials fail closed instead of reporting a false delivery success.
photoconnect.mail.capture-mode=${MAIL_CAPTURE_MODE:true}
photoconnect.mail.from-address=${MAIL_FROM:${MAIL_USERNAME:noreply@photoconnect.vn}}
photoconnect.mail.from-name=${MAIL_FROM_NAME:PhotoConnect Support}

# ── Structured Logging Configuration ─────────────────────────────────────────
logging.level.root=WARN
logging.level.com.photoconnect=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n


